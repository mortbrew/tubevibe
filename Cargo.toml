[package]
name = "tubevibe"
version = "0.8.8"
edition = "2024"
rust-version = "1.88"
description = "YouTube and your local videos and music in the terminal: tabs, video embedded in kitty via mpv, subscriptions, playlists, history with resume, downloads, SponsorBlock, chapters, comments and browser login"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mortbrew/tubevibe"
homepage = "https://github.com/mortbrew/tubevibe"
readme = "README.md"
keywords = ["youtube", "tui", "ratatui", "mpv", "terminal"]
categories = ["command-line-utilities", "multimedia::video"]
exclude = ["/.github", "/ConfigSeed.toml", "/docs", "/packaging"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
flate2 = "1.1.10"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
self-replace = "1.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_ignored = "0.1.14"
serde_json = "1.0.151"
sha1_smol = "1.0.1"
tachyonfx = "0.25"
tar = "0.4.46"
thiserror = "2.0.21"
toml = { version = "1.1.8", features = ["preserve_order"] }
toml_edit = "0.25.17"
trash = "5.2.9"
unicode-width = "0.2"
ureq = "3.4.2"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }

# `cargo deb`: the Debian / Ubuntu package attached to each release.
[package.metadata.deb]
maintainer = "mortbrew <mortbrew@users.noreply.github.com>"
section = "video"
depends = "$auto, mpv"
recommends = "yt-dlp"
suggests = "kitty, xdotool, x11-utils, wmctrl"
extended-description = """\
tubevibe (based on tubetui by polblancoo) browses YouTube from the terminal: your home feed, subscriptions, \
watch later, playlists, history, downloads, search, channels and comments, \
plus your local videos and music. SponsorBlock skips sponsors. Videos play \
with mpv, embedded in kitty, in a window or as an overlay. YouTube changes \
often: keep yt-dlp current (pipx install yt-dlp) rather than the distro one."""
assets = [
    ["target/release/tubevibe", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/tubevibe/README.md", "644"],
    ["packaging/linux/tubevibe.desktop", "usr/share/applications/", "644"],
]
