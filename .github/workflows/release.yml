# On every `v*` tag: build the Linux packages (x86_64 and aarch64 tarballs,
# and an amd64 .deb) and attach them to the GitHub release. macOS and Windows
# have no prebuilt packages: build from source with cargo. It needs no
# secrets: the release is made with the workflow's own token. File names carry
# no version, so links can point at
# https://github.com/mortbrew/tubevibe/releases/latest/download/<file>.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.5.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Release (once; the builds below add their files to it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "tubevibe $TAG"

  linux:
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported runners: the binary then runs on older glibc too.
          - arch: x86_64
            runner: ubuntu-22.04
          # GitHub's arm64 runners (free for public repositories).
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        if: matrix.arch == 'x86_64'
        with:
          tool: cargo-deb
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Package
        run: |
          mkdir -p dist/tubevibe
          cp target/release/tubevibe README.md dist/tubevibe/
          tar -C dist -czf dist/tubevibe-${{ matrix.arch }}-linux.tar.gz tubevibe
      - name: Debian package
        if: matrix.arch == 'x86_64'
        run: cargo deb --no-build --output dist/tubevibe_amd64.deb
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          fail_on_unmatched_files: true
          files: dist/tubevibe-${{ matrix.arch }}-linux.tar.gz
      - uses: softprops/action-gh-release@v2
        if: matrix.arch == 'x86_64'
        with:
          tag_name: ${{ env.TAG }}
          fail_on_unmatched_files: true
          files: dist/tubevibe_amd64.deb

